# Every push to "main" rebuilds the site and copies it to the "gh-pages" branch,
# which GitHub Pages shows at https://<username>.github.io/<repo-name>/
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # lets this workflow update the gh-pages branch

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
      - name: Push the built site to gh-pages
        run: |
          cd out
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" commit -q -m "Publish site from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
